name: deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint client
        run: pnpm --filter @interview/client lint

      - name: Build
        run: pnpm build

  docker:
    name: Docker build
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: nginx
            file: Dockerfile
          - name: app
            file: Dockerfile.app
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Lowercase image name
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}/${{ matrix.name }}:latest
            ghcr.io/${{ steps.image.outputs.name }}/${{ matrix.name }}:${{ github.sha }}

  deploy:
    name: Deploy to server
    needs: docker
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_TAG: ${{ github.sha }}
      # Optional: PAT with read:packages if the GHCR package is private
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
    steps:
      - name: Lowercase image name
        run: echo "GHCR_IMAGE=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          # 首次拉取 milvus/minio/etcd 体积大，默认 10m 极易 Run Command Timeout
          command_timeout: 60m
          script_stop: true
          envs: GHCR_IMAGE,IMAGE_TAG,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin
            git reset --hard "origin/${{ github.ref_name }}"
            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GHCR_IMAGE%%/*}" --password-stdin
            fi
            export GHCR_IMAGE IMAGE_TAG
            docker network create edge-net || true
            docker compose pull
            docker compose up -d
            docker compose -f deploy/edge/docker-compose.yml up -d
            docker image prune -f
