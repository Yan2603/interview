name: deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint client
        run: pnpm --filter @interview/client lint

      - name: Build
        run: pnpm build

  docker:
    name: Docker build
    needs: build
    runs-on: ubuntu-latest

    env:
      # GitHub Actions 使用 Docker Hub 官方镜像；云服务器部署仍默认 daocloud 镜像
      NODE_IMAGE: node:20-slim
      NGINX_IMAGE: nginx:alpine
      MONGO_IMAGE: mongo:7

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Create edge-net for compose validation
        run: docker network create edge-net || true

      - name: Build images
        run: docker compose build

  deploy:
    name: Deploy to server
    needs: docker
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          # 首次拉取 milvus/minio/etcd 体积大，默认 10m 极易 Run Command Timeout
          command_timeout: 60m
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin
            git reset --hard "origin/${{ github.ref_name }}"
            # 构建前先腾磁盘：失败时 prune 不会执行，悬空层会把 ECS 撑满导致 ENOSPC
            df -h
            docker system df || true
            docker builder prune -af || true
            docker image prune -af || true
            # 先拉依赖镜像，再 build/up，避免卡在 milvus Pulling 时整次超时难排查
            docker network create edge-net || true
            docker compose pull mongo postgres etcd minio milvus
            docker compose up -d --build
            docker compose -f deploy/edge/docker-compose.yml up -d
            docker image prune -f
            df -h
