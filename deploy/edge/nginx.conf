events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 6m;

    # Prefer client X-Request-Id; otherwise nginx $request_id
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    log_format edge '$remote_addr - $req_id [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    'rt=$request_time '
                    'upstream="$upstream_addr" us=$upstream_status urt=$upstream_response_time '
                    'target=$edge_target '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log edge;
    error_log  /var/log/nginx/error.log warn;

    # Docker embedded DNS — resolve backends at request time so edge can start
    # before douban-web exists (and recover when containers restart).
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # Default; each location overrides
        set $edge_target unknown;

        add_header X-Request-Id $req_id always;
        add_header X-Served-By "edge/$edge_target" always;

        location /movie/ {
            set $edge_target douban;
            set $douban_upstream douban-web:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $req_id;
            proxy_pass http://$douban_upstream;
        }

        # douban Nest API: client API_BASE_URL=/movie-api/api
        # /movie-api/api/health → douban-api:3000/api/health
        # /movie-api/api/graphql → douban-api:3000/api/graphql
        location /movie-api/ {
            set $edge_target douban-api;
            set $douban_api_upstream douban-api:3000;
            rewrite ^/movie-api/(.*)$ /$1 break;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $req_id;
            proxy_pass http://$douban_api_upstream;
        }

        location /api/ {
            set $edge_target interview;
            set $interview_upstream interview-nginx:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-Id $req_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            client_max_body_size 6m;
            proxy_pass http://$interview_upstream;
        }

        location /uploads/ {
            set $edge_target interview;
            set $interview_upstream interview-nginx:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-Id $req_id;
            proxy_pass http://$interview_upstream;
        }

        location / {
            set $edge_target interview;
            set $interview_upstream interview-nginx:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-Id $req_id;
            proxy_pass http://$interview_upstream;
        }
    }
}
